  if (v==null || v==="") return 0;
  if (typeof v === "number") return v;
  let s = String(v).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".").replace(/[٬,\s]/g,"");

  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }

  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}

// ---------- analysis ----------
const isPL = gl => A().plPrefixes.split(/[,،\s]+/).filter(Boolean).some(p => String(gl).startsWith(p));
function ruleFor(text){
  const n = norm(text);
  for (const r of S.settings.rules){
    const kws = norm(r.kw).split("|").map(s=>s.trim()).filter(Boolean);
    const exs = norm(r.ex||"").split("|").map(s=>s.trim()).filter(Boolean);
    if (kws.some(k=>n.includes(k)) && !exs.some(k=>n.includes(k))) return r;
  }
  return null;
}
const hasSubs = () => S.tb.rows.some(r => r.sub);
function glRows(){
  const tb = S.tb, names = tb.meta.glNames || {};
  if (!hasSubs()){
    const codes = tb.rows.map(r=>String(r.gl));
    return tb.rows.map(r => ({...r, code:r.gl, name:r.name, parent: A().skipParents && codes.some(o => o!==r.gl && o.length>String(r.gl).length && o.startsWith(r.gl))})).filter(r=>!r.parent);
  }
  const m = new Map();
  tb.rows.forEach(r => {
    let g = m.get(r.gl);
    if (!g){ g = {key:r.gl, code:r.gl, gl:r.gl, name:names[r.gl]||r.gl, prior:0, current:0, mdr:0, mcr:0, n:0}; m.set(r.gl, g); }
    g.prior += r.prior; g.current += r.current; g.mdr += r.mdr; g.mcr += r.mcr; g.n++;
  });
  return [...m.values()];
}
function subRows(){
  const names = S.tb.meta.glNames || {};
  return S.tb.rows.map(r => ({...r, code: r.gl+(r.sub?" / "+r.sub:""), glName: names[r.gl]||""}));
}
function leafRows(){ return hasSubs() ? subRows() : glRows().map(r => ({...r, glName:""})); }
function flagRows(rows){
  const a = A(), single = S.tb.meta.mode === "single";
  rows.forEach(r => {
    r.diff = r.current - r.prior;
    r.pct = r.prior ? (r.diff/Math.abs(r.prior))*100 : null;
    const f = [];
    const pl = isPL(r.gl);
    if (!(single && pl)){
      if (r.prior===0 && r.current!==0 && Math.abs(r.current)>=a.amount) f.push({t:"new", c:"c-info", l:"حساب جديد"});
      else if (r.current===0 && r.prior!==0 && Math.abs(r.prior)>=a.amount) f.push({t:"closed", c:"c-info", l:"رصيده صفر هذا العام"});
      else if (r.pct!=null && Math.abs(r.diff)>=a.amount && Math.abs(r.pct)>=a.pct){
        f.push({t:"jump", c: Math.abs(r.pct)>=a.pct*2.5?"c-crit":"c-warn", l:(Math.abs(r.current)>Math.abs(r.prior)?"زيادة":"انخفاض")+" غير طبيعي "+pctTxt(r.pct)});
      }
      if (r.prior && r.current && Math.sign(r.prior)!==Math.sign(r.current) && Math.abs(r.current)>=1) f.push({t:"flip", c:"c-crit", l:"انعكست طبيعة الرصيد"});
    }
    const rule = ruleFor((r.glName||"")+" "+r.name);
    r.rule = rule;
    if (rule && Math.abs(r.current)>=1 && (rule.side==="D" ? r.current<0 : r.current>0)) f.push({t:"contra", c:"c-warn", l:"رصيد معاكس: يعاد تبويبه"});
    r.flags = f;
  });
  return rows;
}
function tbSums(){ const rows = S.tb.rows; return {prior: rows.reduce((s,r)=>s+r.prior,0), current: rows.reduce((s,r)=>s+r.current,0)}; }
function reclassData(year){
  const k = year==="prior" ? "prior" : "current";
  const groups = S.settings.rules.map(r => ({rule:r, normal:0, contra:0, items:[]}));
  leafRows().forEach(a => {
    const rule = ruleFor((a.glName||"")+" "+a.name); if (!rule) return;
    const g = groups[S.settings.rules.indexOf(rule)], v = a[k];
    if (Math.abs(v)<0.005) return;
    if (rule.side==="D" ? v<0 : v>0){ g.contra += v; g.items.push(a); } else g.normal += v;
  });
  return groups.filter(g => g.items.length || g.normal);
}
function docStatus(d){
  if (!d.expiry) return {c:"c-mute", l:"بدون تاريخ انتهاء", days:null};
  const days = Math.round((new Date(d.expiry) - new Date(today()))/86400000);
  if (days < 0) return {c:"c-crit", l:"منتهي منذ "+(-days)+" يوم", days};
  if (days <= 60) return {c:"c-warn", l:"ينتهي خلال "+days+" يوم", days};
  return {c:"c-ok", l:"ساري حتى "+d.expiry, days};
}

const isDepAcc = name => /مجمع/.test(name);

function mapRow(r, rules, overrides){
  const key = r.gl + (r.sub ? "/" + r.sub : "");
  if (overrides && overrides[key]) return overrides[key];
  const nm = normAr(r.name);
  let best = null, bestLen = -1, bestKw = false;
  for (const rule of rules){
    const [p, dr, cr, kw] = rule;
    if (!String(r.gl).startsWith(p)) continue;
    const hasKw = !!kw;
    if (hasKw && !nm.includes(normAr(kw))) continue;
    if (hasKw > bestKw || (hasKw === bestKw && p.length > bestLen)){ best = rule; bestLen = p.length; bestKw = hasKw; }
  }
  if (!best){ const f = FALLBACK_MAP[String(r.gl)[0]]; return f ? (r.current >= 0 ? f[0] : f[1]) : null; }
  return r.current >= 0 ? best[1] : best[2];
}
function normAr(s){ return String(s??"").replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim(); }

// rows: [{gl, sub, name, glName, prior, current, mdr, mcr}] ; returns {sub: value(debit +)} for the current year plus unmapped list
function buildFS(rows, rules, overrides, adjustments){
  const v = {}, src = {}, unmapped = [];
  Object.keys(FS_SUB).forEach(k => { v[k] = 0; src[k] = []; });
  rows.forEach(r => {
    if (Math.abs(r.current) < 0.005) return;
    let s = mapRow(r, rules, overrides);
    if (s === "ppe_cost" && isDepAcc(r.glName || r.name)) s = "ppe_dep";
    if (!s || !(s in v)){ unmapped.push(r); return; }
    v[s] += r.current; src[s].push(r);
  });
  (adjustments||[]).forEach(a => (a.lines||[]).forEach(l => { if (l.sub in v) v[l.sub] += (+l.dr||0) - (+l.cr||0); }));
  return {v, src, unmapped};
}
function lineTotals(v){
  const t = {};
  FS_LINES.forEach(l => t[l.id] = l.subs.reduce((s,[id]) => s + (v[id]||0), 0));
  return t;
}
// Statement figures in presentation sign: assets +, liabilities/equity +, income +, expenses −
function statements(v){
  const t = lineTotals(v);
  const plLines = FS_LINES.filter(l => !BS_SECS.includes(l.sec));
  const netIncome = -plLines.reduce((s,l) => s + t[l.id], 0);
  const p = id => {
    const l = FS_LINES.find(x => x.id===id);
    return ["ca","nca"].includes(l.sec) ? t[id] : -t[id];
  };
  const sum = sec => FS_LINES.filter(l => l.sec===sec).reduce((s,l) => s + p(l.id), 0);
  const eq = sum("eq") + netIncome;
  const ca = sum("ca"), nca = sum("nca"), cl = sum("cl"), ncl = sum("ncl");
  return {t, p, netIncome, ca, nca, cl, ncl, eq, assets: ca+nca, liab: cl+ncl, diff: (ca+nca) - (cl+ncl+eq),
    gross: p("sales") + p("cogs"), opex: p("sell") + p("gna")};
}

**3-1 تصنيف الموجودات والمطلوبات كمتداولة وغير متداولة**
**الموجودات**
تعرض الشركة الموجودات والمطلوبات في قائمة المركز المالي استناداً إلى التصنيف متداول / غير متداول. يتم تصنيف الأصل ضمن الموجودات المتداولة في حالة:

تقوم الشركة بتصنيف جميع الأصول الأخرى كموجودات غير متداولة.
**المطلوبات**
يعتبر الالتزام ضمن المطلوبات المتداولة في حالة:
• توقع تسوية الالتزام خلال دورة الأعمال العادية للشركة،
• الاحتفاظ بالالتزام بشكل رئيسي بغرض المتاجرة،
• توقع تسوية الالتزام خلال 12 شهراً بعد تاريخ قائمة المركز المالي، أو
• عدم وجود حق غير مرتبط بشرط لتأجيل تسوية الالتزام على مدى 12 شهراً على الأقل بعد تاريخ قائمة المركز المالي.
تقوم الشركة بتصنيف جميع الالتزامات الأخرى كمطلوبات غير متداولة.

**3-3 النقدية**

تظهر البضاعة بالتكلفة أو سعر البيع ناقصاً تكاليف الإكمال والبيع، أيهما أقل. تحسب التكلفة على أساس المتوسط المرجح.
**الانخفاض في القيمة**
يتم، بتاريخ كل قائمة مركز مالي، إجراء تقويم للتأكد من وجود انخفاض على قيمة البضاعة. وفي حالة وجود انخفاض في قيمة البضاعة، يتم تخفيض القيمة الدفترية إلى سعر البيع ناقصاً تكاليف الإكمال والبيع. يتم إثبات خسارة الانخفاض في القيمة مباشرةً في الربح أو الخسارة في قائمة الدخل الشامل.`},
  {id:"p3b", t:"3 - السياسات (الأدوات المالية، الممتلكات، الانخفاض، القروض)", body:`**3-6 الموجودات المالية والمطلوبات المالية**
تشتمل الموجودات المالية المسجلة في قائمة المركز المالي بشكل أساسي على النقدية، والمدينين التجاريين والآخرين، تشتمل المطلوبات المالية على الدائنين التجاريين والمبالغ المستحقة الدفع والدائنين الآخرين.
**الانخفاض في قيمة الموجودات المالية وعدم إمكانية تحصيلها**
يتم، بتاريخ كل قائمة مركز مالي، إجراء تقويم للتأكد من وجود دليل على وجود انخفاض في قيمة أصل مالي محدد. وفي حالة وجود مثل هذا الدليل، يتم إثبات خسارة الانخفاض في الربح أو الخسارة في قائمة الدخل الشامل. يحدد الانخفاض في القيمة على النحو التالي:
• بالنسبة للموجودات المسجلة بالتكلفة المطفأة، يمثل الانخفاض في القيمة الفرق بين القيمة الدفترية والقيمة الحالية للتدفقات النقدية المستقبلية المخصومة على أساس معدل العمولة الفعلي الأصلي.
• تمثل خسارة الانخفاض في القيمة الفرق بين القيمة الدفترية للأصل وأفضل تقدير (والذي بالضرورة سيكون تقريبي) للمبلغ (الذي يمكن أن يكون صفر) الذي ستستلمه الشركة مقابل الأصل إذا كان سيتم بيعه بتاريخ إعداد القوائم المالية.
**مقاصة الموجودات المالية والمطلوبات المالية**
تتم مقاصة الموجودات المالية والمطلوبات المالية وتدرج بالصافي في القوائم المالية عند وجود حق نظامي ملزم لمقاصة المبالغ المثبتة وعند وجود نية لتسوية الموجودات مع المطلوبات على أساس الصافي، أو تحقيق الموجودات وسداد المطلوبات في آن واحد.

**3-7 الممتلكات والآلات والمعدات**
تقيد، في الأصل، الممتلكات والآلات والمعدات بالتكلفة، وتظهر بالتكلفة ناقصاً الاستهلاك المتراكم وأي انخفاض في القيمة. تستهلك التكلفة ناقصاً القيمة التقديرية المتبقية على مدى الأعمار الإنتاجية المقدرة للموجودات بطريقة القسط الثابت وكما يلي:
{نسب_الإهلاك}
تتم مراجعة القيمة المتبقية والأعمار الإنتاجية وطرق الاستهلاك ويتم تعديلها مستقبلاً، إذا كان ذلك ملائماً، في حالة وجود دليل على وجود تغير هام منذ تاريخ أحدث تقرير.
تتم مراجعة القيمة الدفترية للممتلكات والآلات والمعدات للتأكد من وجود انخفاض في قيمتها وذلك عندما تشير الأحداث أو التغيرات في الظروف إلى عدم إمكانية استرداد قيمتها الدفترية. وفي حالة وجود مثل هذا الدليل وزيادة القيمة الدفترية عن القيمة المقدرة القابلة للاسترداد، تخفض الموجودات إلى القيمة القابلة للاسترداد لها.
تحدد أرباح أو خسائر الاستبعاد (وذلك بمقارنة متحصلات الاستبعاد مع القيمة الدفترية للأصل)، ويتم إثباتها ضمن "إيرادات أخرى" في قائمة الدخل الشامل.

**3-8 الانخفاض في قيمة الموجودات غير المالية**
يتم، بتاريخ إعداد كل قوائم مالية، مراجعة الممتلكات والآلات والمعدات، للتأكد من وجود دليل على وقوع خسائر انخفاض في قيمتها. وفي حالة وجود دليل على أي انخفاض محتمل، يتم تقدير القيمة القابلة للاسترداد للأصل المتأثر (أو الوحدات المدرة للنقدية) ومقارنتها مع قيمتها الدفترية. وإذا كانت القيمة القابلة للاسترداد أقل، تخفض القيمة الدفترية للأصل إلى القيمة المقدرة القابلة للاسترداد، ويتم إثبات خسارة الانخفاض فوراً في الربح أو الخسارة في قائمة الدخل الشامل.
وبالمقابل، يتم، بتاريخ إعداد كل قوائم مالية، إجراء تقويم للبضاعة للتأكد من وجود انخفاض في قيمتها وذلك بمقارنة القيمة الدفترية لكل بند من بنود البضاعة (أو مجموعة من البنود المتشابهة) مع سعر البيع ناقصاً تكاليف البيع. وفي حالة وجود انخفاض في قيمة أي بند من بنود البضاعة (أو مجموعة من البنود المتشابهة)، عندئذ تخفض قيمته الدفترية إلى سعر البيع ناقصاً تكاليف البيع، ويتم إثبات خسارة الانخفاض فوراً في قائمة الدخل الشامل.

**3-9 القروض والتسهيلات البنكية**
يتم إدراج القروض بالمبالغ المستلمة بعد خصم تكاليف المعاملة المتكبدة، كما يتم تأجيل العمولات الإدارية المخصومة مقدماً وعرضها مخصومة من مبلغ القرض الأصلي. يتم إطفاء تلك العمولات، والتي لا تختلف جوهرياً عن معدل الفائدة على القروض السائدة في السوق، على مدى عمر القرض بطريقة القسط الثابت. ويتم رسملة تكاليف الاقتراض العائدة مباشرة لإنشاء موجودات مؤهلة حتى تصل إلى المرحلة التي يكتمل عندها بشكل جوهري جميع الأنشطة اللازمة لإعداد الموجودات المؤهلة للاستخدام المحدد لها، وبخلاف ذلك، يتم تحميل هذه التكاليف على قائمة الدخل.`},
  {id:"p3c", t:"3 - السياسات (الدائنون، الأطراف ذات العلاقة، المخصصات، الزكاة، المنافع، الإيرادات، الاحتياطي)", body:`**3-10 الدائنون التجاريون والمبالغ المستحقة الدفع والدائنون الآخرون**
الذمم الدائنة التجارية هي عبارة عن التزامات بسداد قيمة البضائع أو الخدمات التي يتم الحصول عليها في سياق العمل الاعتيادي من الموردين. يتم تصنيف الذمم الدائنة التجارية كمطلوبات متداولة إذا كانت هذه الذمم مستحقة السداد خلال سنة واحدة أو أقل، وإلا يتم عرضها كمطلوبات غير متداولة. ويتم إثبات الذمم الدائنة التجارية مبدئياً بسعر المعاملة وتقاس لاحقاً بالتكلفة المطفأة باستخدام طريقة معدل الفائدة الفعلي.

**3-11 المعاملات مع الأطراف ذات علاقة**
يتم اعتماد شروط وأحكام هذه المعاملات من قبل إدارة الشركة وتتعامل الشركة خلال النشاط الاعتيادي لأعمالها بمعاملات مع الأطراف ذات العلاقة على أساس أسعار وشروط عقود معتمدة من إدارة الشركة.

**3-12 المخصصات**
يجب على الشركة إثبات المخصصات:
• عندما يكون لديها التزامات قانونية حالية أو متوقعة نتيجة لأحداث سابقة.
• عندما يحتمل أن يتطلب الأمر استخدام موارد تنطوي على منافع اقتصادية لسداد الالتزام في المستقبل.
• عند تقدير المبلغ بشكل موثوق به.
• عندما يكون أثر القيمة الزمنية للنقود جوهري، تخصم المخصصات باستخدام معدل ما قبل الضريبة والزكاة الذي يعكس تقديرات السوق الحالية للقيمة الزمنية للنقود والمخاطر المصاحبة للالتزام. وعند استخدام الخصم، يتم إثبات الزيادة في المخصص مع مرور الوقت كجزء من تكاليف التمويل في الربح أو الخسارة في قائمة الدخل الشامل.

**3-13 مخصص الزكاة**
تحتسب الزكاة وفقاً لأنظمة هيئة الزكاة والضريبة والجمارك المطبقة في المملكة العربية السعودية على أساس الاستحقاق. يحمّل المخصص على قائمة الدخل الشامل. تعدل الفروقات، الناتجة عن الربوط النهائية إن وجدت، في الفترة التي يتم الانتهاء فيها من الربوط.

**3-14 التزامات المنافع المحددة للموظفين**
تقتصر منافع الموظفين التي تمنحها الشركة لموظفيها بعد انتهاء التوظيف على "مكافأة نهاية الخدمة" فقط، حيث لم يتم استخدام وحدة الائتمان المخططة لقياس التزام مكافأة نهاية الخدمة نظراً لتقييم الإدارة بوجود جهد وتكلفة غير مبررين، ثم استخدام النموذج المبسط دون الاستعانة بخبير إكتواري، تعتقد الإدارة أن رصيد التزام مكافأة نهاية الخدمة والذي يتم احتسابه وفقاً لنظام العمل والعمال السعودي طبقاً للسياسة المحاسبية المتبعة في الشركة، في تاريخ قائمة المركز المالي لا يختلف اختلافاً جوهرياً عن الرصيد وفقاً للاحتساب باستخدام الحسبة الاكتوارية.

**3-15 إثبات المبيعات**
تتحقق إيرادات المبيعات بشكل أساسي من بيع البضاعة، ويتم قياسها بالقيمة العادلة للمبلغ المستلم أو المستحق القبض. يتم إظهار المبالغ المفصح عنها كإيرادات بعد خصم المرتجعات والخصومات والتخفيضات التجارية.
**مبيعات البضاعة**
يتم إثبات مبيعات البضاعة عند استيفاء الشروط التالية:
أ. انتقال المخاطر والمنافع الهامة المصاحبة لملكية البضاعة، ويتم ذلك عند انتقال الملكية للعميل.
ب. عدم الاحتفاظ بعلاقة إدارية مستمرة بالقدر الذي يتعلق عادةً بالملكية ولا بالسيطرة الفعلية على السلع المباعة.
ج. إمكانية قياس مبلغ الإيرادات بشكل موثوق به.
د. احتمال تدفق المنافع الاقتصادية المصاحبة للبيع إلى الشركة.
هـ. إمكانية قياس التكاليف المتكبدة أو التي سيتم تكبدها بشأن عملية البيع بشكل موثوق به.

**3-16 الإيجار الرأسمالي**
يتم إثبات الإيجار الرأسمالي كأصل مستأجر والتزام في نفس الوقت وذلك بالقيمة الحالية للحد الأدنى لدفعات الإيجار أو القيمة السوقية للأصل في تاريخ نشأة الإيجار أيهما أقل باستخدام معدل الفائدة المحتسب عن طريق المؤجر أو معدل تكلفة التمويل الإضافي من الغير كمعدل للخصم عند حساب القيمة الحالية للحد الأدنى لدفعات الإيجار.

**3-17 الاحتياطي النظامي**
طبقاً لنظام الشركات السعودي، يجب على الشركة أن تحول 10% من صافي دخل السنة إلى الاحتياطي النظامي حتى يبلغ مجموع الاحتياطي 30% من رأس المال، وهذا الاحتياطي غير قابل للتوزيع.`},
  {id:"p3d", t:"3 - السياسات (المصروفات، التمويل، الإيجارات، الأرباح، التدفقات)", body:`**3-18 المصروفات**
يتم الاعتراف بجميع المصروفات شاملة مصروفات التشغيل التي تعود مباشرة إلى أنشطة التشغيل الأساسية للشركة، بالإضافة إلى المصروفات العمومية والإدارية والمصروفات الأخرى، وتدرج بقائمة الدخل في الفترة المالية التي تحققت فيها تلك المصروفات.
إن مصروفات البيع والتسويق هي تلك المصروفات التي تتعلق بموظفي المبيعات والإعلان والمصروفات العرضية الأخرى المتعلقة بها، وتصنف جميع المصروفات الأخرى غير المباشرة كمصروفات عمومية وإدارية.

**3-19 مصاريف التمويل**
تمثل مصاريف التمويل العمولة والتكاليف الأخرى التي تتكبدها المنشأة بشأن اقتراض الأموال. تتضمن مصاريف التمويل الآتي:
أ. الأعباء المالية على القروض البنكية المحتسبة باستخدام طريقة العمولة الفعلية.
ب. تقوم الشركة بإثبات جميع تكاليف الاقتراض كمصروف في قائمة الدخل الشامل في الفترة التي يتم تكبدها فيها.

**3-20 الإيجارات**
يصنف عقد الإيجار على أنه عقد إيجار تمويلي إذا كان يحول كافة المخاطر والمنافع المصاحبة لملكية الأصل المستأجر إلى الشركة. تصنف كافة الإيجارات الأخرى كعقود إيجارات تشغيلية.
**الشركة كمستأجر**
يتم إثبات حقوق الموجودات المقتناة بموجب عقود الإيجار التمويلي كموجودات خاصة بالشركة بالقيمة العادلة للعقار المستأجر (أو إذا كانت أقل، بالقيمة الحالية للحد الأدنى لدفعات الإيجار) عند نشأة عقد الإيجار. تدرج الالتزامات المقابلة تجاه المؤجر في قائمة المركز المالي كالتزامات بموجب عقود إيجار تمويلي. توزع دفعات الإيجار التمويلي بين تكاليف التمويل والنقص في التزامات الإيجار للحصول على معدل عائد ثابت على الرصيد المتبقي من الالتزام. يجب احتساب القيمة الحالية للحد الأدنى لدفعات الإيجار باستخدام معدل العمولة الضمني في عقد الإيجار. تخصم تكاليف التمويل عند قياس الربح أو الخسارة في قائمة الدخل الشامل. تدرج الموجودات المقتناة بموجب عقود الإيجار التمويلي ضمن الممتلكات والآلات والمعدات، وتستهلك على مدى العمر الإنتاجي المقدر للأصل وفترة الإيجار. تحمل دفعات الإيجار بموجب عقود الإيجارات التشغيلية على الربح أو الخسارة بطريقة القسط الثابت على مدى فترة الإيجار المعني.

**3-21 توزيعات الأرباح**
تقيد الأرباح الموزعة في القوائم المالية في الفترة التي يتم فيها الموافقة على التوزيع من قبل الشركاء السنوية للشركة حيث تقيد هذه التوزيعات كالتزام على الشركة وتطرح من الأرباح المبقاة.

**3-22 قائمة التدفقات النقدية**
يتم إعداد قائمة التدفقات النقدية طبقاً للطريقة غير المباشرة.`},
  {id:"p4", t:"4 - التقديرات والافتراضات والأحكام المحاسبية الهامة", body:`يتطلب إعداد القوائم المالية للشركة من الإدارة إجراء الأحكام والتقديرات والافتراضات التي قد تؤثر على مبالغ الإيرادات والمصاريف والموجودات والمطلوبات المسجلة والإفصاح عن الالتزامات المحتملة بتاريخ إعداد القوائم المالية. وقد يترتب عن عدم التأكد من هذه الافتراضات والتقديرات إجراء تعديل جوهري على القيم الدفترية للموجودات أو المطلوبات التي ستتأثر بذلك في المستقبل.
تستند هذه التقديرات والافتراضات على الخبرة وعوامل أخرى مختلفة يعتقد بأنها معقولة وفقاً للظروف وتستخدم لقياس القيم الدفترية للموجودات والمطلوبات التي يصعب الحصول عليها من مصادر أخرى. تتم مراجعة التقديرات والافتراضات المعنية بصورة مستمرة. يتم إثبات التعديلات على التقديرات المحاسبية في الفترة التي يتم فيها تعديل التقديرات أو في فترة التعديل والفترات المستقبلية إذا كانت التقديرات المتغيرة تؤثر على الفترة الحالية والفترات المستقبلية.

**4-1 المصادر الرئيسية لعدم التأكد من التقديرات**
تم أدناه عرض الافتراضات الأساسية المتعلقة بالمستقبل والمصادر الرئيسية الأخرى لعدم التأكد من التقديرات بتاريخ إعداد القوائم المالية، والتي قد ينتج عنها فروقات جوهرية في القيمة الدفترية للموجودات والمطلوبات خلال الفترة المالية التالية. استخدمت الشركة هذه الافتراضات والتقديرات المتاحة عند إعداد القوائم المالية. ومع ذلك، قد تتغير الظروف والافتراضات القائمة والمتعلقة بالتطورات المستقبلية نتيجة لتغيرات السوق أو الظروف التي تنشأ خارجة عن سيطرة الشركة. يتم إظهار هذه التغيرات في الافتراضات عند حدوثها.

**4-1-1 الانخفاض في قيمة الموجودات غير المالية**
يحدث الانخفاض في القيمة عند زيادة القيمة الدفترية للأصل أو الوحدة المدرة للنقدية عن القيمة القابلة للاسترداد، والتي تمثل القيمة العادلة ناقصة تكاليف الاستبعاد أو القيمة الحالية، أيهما أعلى. يتم احتساب القيمة العادلة ناقصة تكاليف الاستبعاد على أساس البيانات المتاحة لمعاملات البيع الملزمة، التي تمت بشروط تعامل عادل، لموجودات مماثلة أو أسعار السوق القابلة للملاحظة ناقصة التكاليف الإضافية لاستبعاد الأصل. يتم احتساب القيمة الحالية على أساس طريقة التدفقات النقدية المخصومة. يتم تحديد التدفقات النقدية من الموازنة التقديرية للسنوات الخمس القادمة ولا تشمل أنشطة إعادة الهيكلة التي لم تلتزم بها الشركة بعد أو الاستثمارات المستقبلية الهامة التي من شأنها تعزيز أداء الوحدة المدرة للنقدية الخاضعة لاختبار الانخفاض في القيمة. تتأثر القيمة القابلة للاسترداد بمعدل الخصم المستخدم في طريقة التدفقات النقدية المخصومة وكذلك التدفقات النقدية الواردة المستقبلية المتوقعة ومعدل النمو المستخدم لأغراض الاستقراء.

**4-1-2 المخصصات**
تعتمد المخصصات، بحسب طبيعتها، على تقديرات وعمليات تقويم للتأكد فيما إذا تم استيفاء ضوابط الإثبات، بما في ذلك تقدير المبالغ المحتمل سدادها. تستند مخصصات الدعاوى القضائية إلى تقدير التكاليف، بعد الأخذ بعين الاعتبار، المشورة القانونية وغيرها من المعلومات المتاحة حالياً. كما تتضمن مخصصات مكافأة نهاية الخدمة وتكاليف المغادرة، إن وجدت، حكم الإدارة في تقدير التدفقات النقدية الصادرة المتوقعة لدفع مكافأة نهاية الخدمة وإغلاق المواقع أو تكاليف المغادرة الأخرى. تتضمن المخصصات المتعلقة بالمطلوبات غير المؤكدة، أفضل تقديرات الإدارة فيما إذا كان من المحتمل وقوع التدفقات النقدية الصادرة.

**4-1-3 الافتراضات طويلة الأجل المتعلقة بمنافع الموظفين**
تمثل مكافأة نهاية الخدمة، الالتزامات التي سيتم سدادها في المستقبل وتتطلب وضع افتراضات في تقدير الالتزامات والقيمة العادلة لموجودات البرنامج، إن وجدت. يتعين على الإدارة إجراء المزيد من الافتراضات المتعلقة بالمتغيرات مثل معدلات الخصم ومعدل الزيادة في الرواتب والعائد على الموجودات ومعدلات الوفيات ومعدل دوران الموظفين. يمكن أن يكون للتغيرات في الافتراضات الأساسية تأثير هام على التزامات المنافع المتوقعة و/أو تكاليف منافع الموظفين المحددة الدورية المتكبدة.

**4-1-4 الأعمار الإنتاجية المقدرة للممتلكات والآلات والمعدات**
تقوم إدارة الشركة بتحديد الأعمار الإنتاجية المقدرة للممتلكات والآلات والمعدات لأغراض الاستهلاك على أساس القسط الثابت على مدى الأعمار الإنتاجية المقدرة لها. يتم تحديد هذا التقدير بعد الأخذ بعين الاعتبار الاستخدام المتوقع للأصل أو الاستهلاك العادي.
تقوم الإدارة بمراجعة الأعمار الإنتاجية والقيمة المتبقية للموجودات على الأقل مرة واحدة في الفترة، وسيتم في نهاية كل فترة مالية تعديل قسط الاستهلاك المستقبلي في حالة اعتقاد الإدارة بأن الأعمار الإنتاجية تختلف عن التقديرات السابقة.

**4-1-5 انخفاض الذمم المدينة التجارية**
يتم إجراء تقدير للمبالغ القابلة للتحصيل من الذمم المدينة التجارية عند عدم إمكانية تحصيل المبلغ بالكامل. بالنسبة لكل مبلغ من المبالغ الهامة، يتم إجراء هذا التقدير لكل مبلغ على حده. أما المبالغ التي لا تعتبر هامة بمفردها ولكنها متأخرة السداد، فإنه يتم تقديرها بشكل جماعي، ويجنب مخصص حسب طول مدة التأخر في السداد بناءً على معدلات التحصيل السابقة.

**4-1-6 انخفاض قيمة البضاعة**
تظهر البضاعة بالتكلفة أو صافي القيمة البيعية، أيهما أقل. وعندما تصبح البضاعة قديمة أو متقادمة، يتم إجراء تقدير لصافي القيمة البيعية لها. بالنسبة لكل مبلغ من المبالغ الهامة، يتم إجراء هذا التقدير لكل مبلغ على حده. أما المبالغ غير الهامة بمفردها والتي تعتبر قديمة أو متقادمة، فإنه يتم تقديرها بشكل جماعي ويجنب مخصص حسب نوع البضاعة وعمرها أو درجة تقادمها على أساس أسعار البيع المتوقعة.

**4-1-7 مبدأ الاستمرارية**
قامت إدارة الشركة بعمل تقييم لقدرتها على الاستمرار على أساس مبدأ الاستمرارية وتوصلت إلى أن لديها الموارد للاستمرار في نشاطها في المستقبل المنظور. إضافة لذلك ليست الإدارة على دراية بأي عدم تيقن جوهري، قد يلقي بظلال من الشك حول قدرة الشركة على الاستمرار. وبالتالي، تم الاستمرار في إعداد القوائم المالية على أساس مبدأ الاستمرارية.

**4-1-8 قياس القيمة العادلة للأدوات المالية**
في حالة عدم إمكانية قياس القيمة العادلة للموجودات المالية والمطلوبات المالية المسجلة في قائمة المركز المالي على أساس الأسعار المتداولة في أسواق نشطة، تحدد قيمتها العادلة باستخدام طرق تقويم تشتمل على نموذج التدفقات النقدية المخصومة. إن المدخل إلى هذه النماذج يتم من خلال الأسواق القابلة للملاحظة، إذا كان ذلك ممكناً، وإذا لم يكن ذلك مجدياً فإنه يجب استخدام درجة من الأحكام لتحديد القيمة العادلة. تشتمل الأحكام على الأخذ بالاعتبار المدخلات مثل مخاطر السيولة، ومخاطر الائتمان والتقلبات. إن تغير الافتراضات المتعلقة بهذه العوامل سيؤثر على القيمة العادلة المسجلة للأدوات المالية.`},
];

function mapByName(r){
  const n = normAr((r.glName ? r.glName+" " : "") + r.name), d = String(r.gl)[0];
  const hit = NAME_MAP.find(([k,,,ds]) => ds.includes(d) && k.split("|").some(w => n.includes(w)));
  return hit ? (r.current >= 0 ? hit[1] : hit[2]) : null;
}

// S.coa.rows: Map code -> {code, name, dr, cr, ok}; dr/cr = sub-line when the balance is debit / credit, ok = confirmed by the user
const coaOn = () => S.coa.rows.size > 0;
function suggestFor(code, name){
  const one = cur => { const r = {gl:String(code), sub:"", name, glName:"", current:cur}; return autoMap(r).s; };
  return {dr:one(1), cr:one(-1)};
}
// the mapping logic used before a chart exists, and to suggest lines for new chart accounts
function autoMap(r){
  const longest = DEFAULT_MAP.filter(([p]) => r.gl.startsWith(p)).reduce((m,[p]) => Math.max(m, p.length), 0);
  let s = longest >= 3 ? mapRow(r, DEFAULT_MAP, null) : mapByName(r), how = "rule";
  if (!s){ s = mapRow(r, DEFAULT_MAP, null); if (!longest) how = "guess"; }
  if (s==="ppe_cost" && isDepAcc(r.glName || r.name)) s = "ppe_dep";
  return {s, how};
}
function mapHow(r){
  const ov = S.fs.overrides;
  if (r.sub && ov[r.gl+"/"+r.sub]) return {s:ov[r.gl+"/"+r.sub], how:"manual"};
  if (coaOn()){
    const a = S.coa.rows.get(r.gl);
    if (!a) return {s:null, how:"missing"};
    const s = r.current >= 0 ? a.dr : (a.cr || a.dr);
    return {s: s || null, how: !s ? "missing" : a.ok ? "coa" : "suggested"};
  }
  if (ov[r.gl]) return {s:ov[r.gl], how:"manual"};
  return autoMap(r);
}

let coaTimer = null;
function saveCoa(now){
  clearTimeout(coaTimer);
  const run = async () => {
    const rows = [...S.coa.rows.values()].sort((a,b) => a.code.localeCompare(b.code, "en", {numeric:true}));
    const CH = 700, n = Math.ceil(rows.length/CH), oldN = (S.coa.meta && S.coa.meta.chunks) || 0;
    const meta = {chunks:n, count:rows.length, savedAt:new Date().toISOString(), source:(S.coa.meta && S.coa.meta.source) || ""};
    S.coa.meta = meta; S.coa.loadedAt = meta.savedAt; fsCache = null;
    if (!S.db) return;
    for (let i=0;i<n;i++) await save("coa/c"+i, {rows:rows.slice(i*CH,(i+1)*CH).map(a => [a.code, a.name, a.dr||"", a.cr||"", a.ok?1:0])});
    for (let i=n;i<oldN;i++) await del("coa/c"+i);
    await save("coa/meta", meta);
  };
  if (now) return run();
  coaTimer = setTimeout(run, 700);
}
function coaFromRows(list, source){
  const m = new Map();
  list.forEach(([code, name]) => { code = String(code).trim(); if (!code || m.has(code)) return;
    const old = S.coa.rows.get(code), ov = S.fs.overrides[code];
    if (old) m.set(code, {...old, name: name || old.name});
    else if (ov) m.set(code, {code, name, dr:ov, cr:ov, ok:true});
    else { const sg = suggestFor(code, name); m.set(code, {code, name, dr:sg.dr, cr:sg.cr===sg.dr ? "" : sg.cr, ok:false}); }
  });
  S.coa.rows = m; S.coa.meta = {...(S.coa.meta||{}), source};
  return saveCoa(true);
}
// leaf accounts of an imported chart: codes that no other code extends
function coaLeaves(list){
  const codes = list.map(([c]) => String(c));
  const set = new Set(codes);
  return list.filter(([c]) => { c = String(c); for (const o of set) if (o !== c && o.length > c.length && o.startsWith(c)) return false; return true; });
}
function coaFromTB(){
  const names = S.tb.meta.glNames || {}, seen = new Map();
  S.tb.rows.forEach(r => { if (!seen.has(String(r.gl))) seen.set(String(r.gl), names[r.gl] || r.name); });
  const list = [...seen.entries()];
  return coaFromRows(hasSubs() ? list : coaLeaves(list), "الميزان");
}
function coaParse(s){
  const aoa = XLSX.utils.sheet_to_json(s.wb.Sheets[s.sheet], {header:1, raw:true, defval:""});
  let hdr = -1, cc = 0, nc = 1;
  for (let i=0;i<Math.min(20,aoa.length);i++){
    const row = aoa[i].map(x => String(x||""));
    const c = row.findIndex(x => RX.code.test(x)), n = row.findIndex((x,j) => j!==c && RX.name.test(x));
    if (c>=0 && n>=0){ hdr = i; cc = c; nc = n; break; }
  }
  s.aoa = aoa; s.headers = (aoa[Math.max(hdr,0)]||[]).map((h,i) => String(h||"").trim() || ("عمود "+(i+1)));
  if (s.cc==null){ s.cc = cc; s.nc = nc; }
  s.hdr = hdr;
  const out = [];
  aoa.slice(hdr+1).forEach(r => { const c = String(r[s.cc]??"").trim(), n = String(r[s.nc]??"").trim(); if (/^\d[\d.\-]*$/.test(c) && n) out.push([c, n]); });
  s.list = out;
  // a type column (رئيسي / فرعي) decides which accounts take postings; otherwise the code hierarchy does
  const body = aoa.slice(hdr+1), tc = s.headers.findIndex((_,i) => body.filter(r => /^(فرعي|تحليلي)$/.test(String(r[i]||"").trim())).length > 5);
  if (tc >= 0){ const leaf = new Set(body.filter(r => /^(فرعي|تحليلي)$/.test(String(r[tc]||"").trim())).map(r => String(r[s.cc]).trim())); s.leaves = out.filter(([c]) => leaf.has(c)); }
  else s.leaves = coaLeaves(out);
}

let fsCache = null;
function fsCompute(){
  const key = (S.tb.meta.importedAt||"sample")+"|"+JSON.stringify(S.fs.overrides)+"|"+JSON.stringify(S.fs.adj)+"|"+(S.coa.loadedAt||"")+"|"+S.coa.rows.size;
  if (fsCache && fsCache.key===key) return fsCache;
  const rows = fsRows(), base = {}, src = {}, mov = {};
  Object.keys(FS_SUB).forEach(k => { base[k] = 0; src[k] = []; mov[k] = {open:0, dr:0, cr:0}; });
  rows.forEach(r => {
    const m = mapHow(r); r.fs = m.s; r.how = m.how;
    if (!m.s || !(m.s in base)) return;
    base[m.s] += r.current; mov[m.s].open += r.prior; mov[m.s].dr += r.mdr; mov[m.s].cr += r.mcr;
    if (Math.abs(r.current)>=0.005) src[m.s].push(r);
  });
  const v = {...base}, adjBySub = {};
  S.fs.adj.forEach(a => (a.lines||[]).forEach(l => { if (!(l.sub in v)) return; const d = (+l.dr||0) - (+l.cr||0); v[l.sub] += d; adjBySub[l.sub] = (adjBySub[l.sub]||0) + d; }));
  const prior = S.fs.prior || DRAFT_PRIOR;
  const pv = {}; Object.keys(FS_SUB).forEach(k => pv[k] = +(prior.v||{})[k] || 0);
  const st = statements(v), pst = statements(pv);
  st.oci = -(v.reval - pv.reval); pst.oci = +prior.oci || 0;
  fsCache = {key, rows, base, v, pv, src, mov, adjBySub, st, pst, prior};
  return fsCache;
}

function fsChecks(){
  const F = fsCompute(), st = F.st, out = [], sums = tbSums();
  const add = (ok, t, d, warnOnly) => out.push({c: ok ? "c-ok" : warnOnly ? "c-warn" : "c-crit", l: ok ? "مطابق" : warnOnly ? "يحتاج مراجعة" : "فرق", t, d});
  add(Math.abs(sums.current)<1 && Math.abs(sums.prior)<1, "توازن ميزان المراجعة", `مجموع الأرصدة آخر المدة ${fmt(sums.current)} وأول المدة ${fmt(sums.prior)}.`);
  add(Math.abs(st.diff)<1, "توازن قائمة المركز المالي بعد الربط والتسويات", `الموجودات ${fmt(st.assets)} مقابل المطلوبات وحقوق الملكية ${fmt(st.liab+st.eq)}.`);
  const bad = F.rows.filter(r => ["guess","missing","suggested"].includes(r.how) && Math.abs(r.current)>=1);
  const lbl = {guess:"بالتخمين", missing:"مش في الدليل", suggested:"مقترح"};
  add(!bad.length, "كل الحسابات مربوطة بدليل الحسابات", bad.length ? bad.length+" حساب محتاج ربط أو تأكيد، أكبرها: "+bad.sort((x,y)=>Math.abs(y.current)-Math.abs(x.current)).slice(0,3).map(r=>esc(r.name)+" ("+lbl[r.how]+") "+fmt(r.current)).join("، ") : coaOn() ? "كل حسابات الميزان مربوطة ومؤكدة في الدليل." : "لا يوجد حساب بالتخمين.", !F.rows.some(r => r.how==="missing" && Math.abs(r.current)>=1));
  const depExp = F.base.g_dep, depCr = F.mov.ppe_dep.cr;
  add(Math.abs(depExp-depCr)<1, "مصروف الاستهلاك مقابل حركة مجمع الاستهلاك", `المصروف في قائمة الدخل ${fmt(depExp)} · المضاف لمجمع الاستهلاك (دائن) ${fmt(depCr)} · الفرق ${fmt(depExp-depCr)}. المستبعد من المجمع (مدين) ${fmt(F.mov.ppe_dep.dr)}.`);
  const eExp = F.base.g_eosb, eCr = F.mov.eosb.cr, ePaid = F.mov.eosb.dr;
  add(Math.abs(eExp-eCr)<1, "مصروف نهاية الخدمة مقابل حركة المخصص", `المصروف ${fmt(eExp)} · المكوّن في المخصص (دائن) ${fmt(eCr)} · المدفوع من المخصص (مدين) ${fmt(ePaid)} · الفرق ${fmt(eExp-eCr)}. المراجع بيطلب كشف احتساب لكل موظف يطابق الرصيد ${fmt(-F.v.eosb)}.`);
  add(Math.abs(F.v.zakat)>=1 && Math.abs(F.v.zakat_exp)>=1, "مخصص الزكاة للسنة", `مصروف الزكاة ${fmt(F.v.zakat_exp)} · رصيد المخصص ${fmt(-F.v.zakat)}. لو لسه ما اتحسبتش أضفها كتسوية.`, true);
  const costDisp = F.mov.ppe_cost.cr;
  add(!(costDisp>=1 && Math.abs(F.v.gain_ppe)<1), "أرباح/خسائر استبعاد الأصول", `تكلفة مستبعدة ${fmt(costDisp)} ومجمع مستبعد ${fmt(F.mov.ppe_dep.dr)}، وأرباح الاستبعاد في قائمة الدخل ${fmt(-F.v.gain_ppe)}.`, true);
  const neg = FS_LINES.filter(l => BS_SECS.includes(l.sec) && l.id!=="re" && st.p(l.id) < -1);
  add(!neg.length, "بنود المركز المالي بإشارة سالبة", neg.length ? neg.map(l => esc(l.t)+" "+fmt(st.p(l.id))).join("، ") : "لا يوجد بند سالب.", true);
  const recl = ["custadv","supadv"].map(s => esc(FS_SUB[s].t)+" "+fmt(Math.abs(F.v[s]))).join(" · ");
  out.push({c:"c-info", l:"معلومة", t:"الأرصدة المعاكسة اللي اتنقلت تلقائيًا", d:recl+`. التفاصيل في شاشة إعادة التبويب.`});
  const unb = S.fs.adj.filter(x => Math.abs((x.lines||[]).reduce((s,l)=>s+(+l.dr||0)-(+l.cr||0),0))>=0.005);
  add(!unb.length, "توازن قيود التسويات", unb.length ? unb.length+" قيد غير متوازن." : S.fs.adj.length+" قيد كلها متوازنة.");
  out.push({c:"c-info", l:"معلومة", t:"الأهمية النسبية", d:`1% من صافي المبيعات = ${fmt(st.p("sales")*0.01)}. أي فرق أقل منها غالبًا لن يعدله المراجع.`});
  return out;
}

function rateFor(name){ const n = norm(name); const f = DEFAULT_RATES.find(([k]) => k.split("|").some(x => n.includes(norm(x)))); return f ? f[1] : ""; }
function faClasses(){
  const F = fsCompute(), m = new Map();
  F.rows.filter(r => r.fs==="ppe_cost" || r.fs==="ppe_dep").forEach(r => {
    const k = r.gl.length>=7 ? r.gl.slice(0,5) : r.gl;
    let c = m.get(k);
    if (!c){ c = {k, name:"", cost:{open:0,add:0,disp:0,close:0}, dep:{open:0,add:0,disp:0,close:0}, costRows:[]}; m.set(k, c); }
    if (r.fs==="ppe_cost"){
      c.cost.open += r.prior; c.cost.add += r.mdr; c.cost.disp += r.mcr; c.cost.close += r.current; c.costRows.push(r);
      if (!c.name) c.name = String(r.glName||r.name).replace(/القيمة الدفترية( لل| ل)?/,"").trim();
    } else { c.dep.open -= r.prior; c.dep.add += r.mcr; c.dep.disp += r.mdr; c.dep.close -= r.current; if (!c.name) c.name = String(r.glName||r.name).replace(/مجمع (اهلاك|إهلاك|استهلاك)/,"").trim(); }
  });
  return [...m.values()].map(c => ({...c, rate: S.fs.rates[c.k] ?? rateFor(c.name)}));
}

function fillLetter(body, fields){
  const c = C();
  const map = {"الشركة":c.name,"السجل_التجاري":c.cr,"الرقم_الضريبي":c.vat,"العنوان":c.address,"المراجع":c.auditor,"عنوان_المراجع":c.auditorAddress,"بريد_المراجع":c.auditorEmail,
    "نهاية_السنة":c.fyEnd,"التاريخ":fields.date||today(),"المفوض":c.signatory,"صفة_المفوض":c.signatoryTitle,"الطرف":fields.party,"المبلغ":fields.amount,"طبيعة_الرصيد":fields.side,"رقم_الحساب":fields.account};
  return body.replace(/\{([^{}]+)\}/g, (m0,k) => (map[k]!=null && String(map[k]).trim()!=="") ? map[k] : "........");
}
function coverageList(group, pct){
  const rows = leafRows().filter(r => { const ru = ruleFor((r.glName||"")+" "+r.name); return ru && ru.group===group && Math.abs(r.current)>=1; })
    .sort((a,b)=>Math.abs(b.current)-Math.abs(a.current));
  const total = rows.reduce((s,r)=>s+Math.abs(r.current),0);
  const out = []; let acc = 0;
  for (const r of rows){ if (total && acc/total*100 >= pct) break; out.push(r); acc += Math.abs(r.current); }
  return {rows:out, all:rows.length, total, acc};
}

// ---------- import parsing ----------
const RX = { code:/رقم|كود|code|^no$|الرمز/i, name:/اسم|البيان|name|desc/i, dr:/مدين|debit|^dr/i, cr:/دائن|credit|^cr/i, bal:/رصيد|balance/i };
function loadSheet(s, keepHdr){
  s.aoa = XLSX.utils.sheet_to_json(s.wb.Sheets[s.sheet], {header:1, raw:true, defval:""});
  if (!keepHdr){
    s.hdr = 0; let best = 0;
    for (let i=0;i<Math.min(20,s.aoa.length);i++){
      const score = s.aoa[i].reduce((t,c) => typeof c!=="string" ? t : t + (RX.dr.test(c)||RX.cr.test(c) ? 2 : (RX.bal.test(c)||RX.name.test(c)||RX.code.test(c)) ? 1 : 0), 0);
      if (score > best){ best = score; s.hdr = i; }
    }
  }
  const hdrRow = s.aoa[s.hdr]||[], above = s.aoa[s.hdr-1]||[];
  let carry = "";
  s.headers = hdrRow.map((h,i) => { if (String(above[i]||"").trim()) carry = String(above[i]).trim(); return [carry, String(h||"").trim()].filter(Boolean).join(" / "); });
  guessMap(s);
  // two-line layout: GL row followed by an analytic row with no amounts
  const data = s.aoa.slice(s.hdr+1).filter(r => r.some(c => c!=="" && c!=null));
  const amtCols = s.headers.map((_,i)=>i).filter(i => i!==s.map.code && i!==s.map.name);
  const noAmt = data.filter(r => !amtCols.some(i => isNum(r[i]))).length;
  s.pair = data.length>10 && noAmt/data.length > 0.35;
}
function guessMap(s){
  const H = s.headers, idx = rx => H.map((h,i)=>rx.test(h)?i:-1).filter(i=>i>=0);
  const nameI = H.findIndex(h=>/اسم|name|البيان/i.test(h));
  let codeI = H.findIndex((h,i)=>RX.code.test(h) && i!==nameI);
  const drs = idx(RX.dr), crs = idx(RX.cr), bals = idx(RX.bal).filter(i=>!drs.includes(i)&&!crs.includes(i));
  const mk = w => {
    if (drs.length && crs.length) return {type:"dc", dr: w==="first"?drs[0]:drs[drs.length-1], cr: w==="first"?crs[0]:crs[crs.length-1], bal:-1};
    if (bals.length) return {type:"bal", bal: w==="first"?bals[0]:bals[bals.length-1], dr:-1, cr:-1};
    return {type:"bal", bal:-1, dr:-1, cr:-1};
  };
  const mov = drs.length>=3 && crs.length>=3 ? {dr:drs[1], cr:crs[1]} : null;
  s.map = {code:codeI, name:nameI>=0?nameI:H.findIndex(h=>RX.name.test(h)), prior:mk("first"), current:mk("last"), mov};
}
function balOf(row, p){ return p.type==="dc" ? num(row[p.dr]) - num(row[p.cr]) : (p.bal>=0 ? num(row[p.bal]) : 0); }
function parseSource(s){
  const mp = s.map, rows = [], glNames = {};
  const data = s.aoa.slice(s.hdr+1).filter(r => r.some(c => c!=="" && c!=null));
  const cell = (r,i) => i>=0 ? String(r[i]??"").trim() : "";
  const skip = r => { const c = cell(r,mp.code); return /اجمالي|إجمالي|المجموع|عدد السجلات|total/i.test(c) || (!c && /^(ال)?(اجمالي|إجمالي|المجموع)/.test(cell(r,mp.name))); };
  const mk = (r, gl, glName, sub, name) => {
    glNames[gl] = glNames[gl] || glName;
    rows.push({gl, sub, name, prior: balOf(r, mp.prior), current: balOf(r, mp.current), mdr: mp.mov?num(r[mp.mov.dr]):0, mcr: mp.mov?num(r[mp.mov.cr]):0});
  };
  if (s.pair){
    // each account takes two lines: the GL line with amounts, then the analytic line (blank when there is none)
    const all = s.aoa.slice(s.hdr+1), blank = r => !r || !r.some(c => c!=="" && c!=null);
    const amtCols = s.headers.map((_,i)=>i).filter(i => i!==mp.code && i!==mp.name);
    const hasAmt = r => amtCols.some(i => isNum(r[i]));
    for (let i=0;i<all.length;){
      const r = all[i];
      if (blank(r) || skip(r)){ i++; continue; }
      const nx = all[i+1];
      if (blank(nx)){ mk(r, cell(r,mp.code), cell(r,mp.name), "", cell(r,mp.name)); i += 2; }
      else if (hasAmt(nx) || skip(nx)){ mk(r, cell(r,mp.code), cell(r,mp.name), "", cell(r,mp.name)); i += 1; }
      else { mk(r, cell(r,mp.code), cell(r,mp.name), cell(nx,mp.code), cell(nx,mp.name)); i += 2; }
    }
  } else {
    data.forEach(r => { if (skip(r)) return; const code = cell(r,mp.code), name = cell(r,mp.name); if (!code && !name) return; mk(r, code||name, name, "", name||code); });
  }
  return {rows, glNames};
}
async function applyImport(){
  const imp = S.ui.imp; let rows, glNames;
  if (imp.mode==="single"){ ({rows, glNames} = parseSource(imp.src.A)); }
  else {
    const pa = parseSource(imp.src.A), pb = parseSource(imp.src.B), m = new Map();
    glNames = {...pa.glNames, ...pb.glNames};
    pa.rows.forEach(r => m.set(r.gl+"/"+r.sub, {...r, prior:r.current, current:0, mdr:0, mcr:0}));
    pb.rows.forEach(r => { const k = r.gl+"/"+r.sub, e = m.get(k); if (e){ e.current = r.current; e.mdr = r.mdr; e.mcr = r.mcr; e.name = r.name||e.name; } else m.set(k, {...r, prior:0}); });
    rows = [...m.values()].sort((a,b)=>String(a.gl).localeCompare(String(b.gl),"en",{numeric:true}) || String(a.sub).localeCompare(String(b.sub),"en",{numeric:true}));
  }
  if (!rows.length){ toast("ما لقيتش حسابات. راجع صف العناوين والأعمدة."); return; }
  const meta = {mode:imp.mode, files:Object.values(imp.src).map(s=>s.fname), importedAt:new Date().toISOString(), glNames};
  await writeTB(meta, rows);
  S.ui.imp.src = {}; S.view = "compare"; render();
  const miss = coaOn() ? new Set(rows.filter(r => !S.coa.rows.has(String(r.gl))).map(r => r.gl)).size : 0;
  toast("تم حفظ الميزان: "+rows.length+" حساب"+(miss ? ". فيه "+miss+" حساب جديد مش في دليل الحسابات، اربطه من شاشة دليل الحسابات." : ""));
}
async function writeTB(meta, rows){
  const r2 = v => Math.round(v*100)/100;
  S.tb = {meta, rows:rows.map(r => ({...r, key:r.gl+(r.sub?"/"+r.sub:"")}))}; S.tbLoadedAt = meta.importedAt;
  if (S.db){
    const CH = 600, enc = rows.map(r => [r.gl, r.sub, r.name, r2(r.prior), r2(r.current), r2(r.mdr), r2(r.mcr)]);
    const n = Math.ceil(enc.length/CH);
    try{
      const old = await S.db.doc("tb/meta").get();
      for (let i=0;i<n;i++) await S.db.doc("tb/c"+i).set({rows:enc.slice(i*CH,(i+1)*CH)});
      const oldN = old.exists ? (old.data().chunks||0) : 0;
      for (let i=n;i<oldN;i++) await S.db.doc("tb/c"+i).delete();
      await S.db.doc("tb/meta").set({...meta, chunks:n, count:rows.length});
    }catch(e){ dbErr(e); }
  }
}

async function backupExport(btn){
  if (!window.JSZip) return;
  btn.disabled = true; btn.textContent = "جاري تجهيز النسخة…";
  try{
    const z = new JSZip(), clean = o => JSON.parse(JSON.stringify(o));

      fsmap:{overrides:S.fs.overrides}, fsprior:S.fs.prior, fa:{rates:S.fs.rates}, faDocs:Object.values(S.fs.faDocs).filter(h => (h.files||[]).length || h.notes),
      adj:S.fs.adj, policies:Object.values(S.fs.policies), coa:coaOn() ? {source:(S.coa.meta||{}).source||"", rows:[...S.coa.rows.values()].map(a => [a.code, a.name, a.dr||"", a.cr||"", a.ok?1:0])} : null, tb:S.tb.meta.sample ? null : {meta:S.tb.meta, rows:S.tb.rows.map(r => [r.gl, r.sub, r.name, r.prior, r.current, r.mdr, r.mcr])}};
    const holders = [...S.requests, ...S.docs, ...data.faDocs];

    }
    z.file("data.json", JSON.stringify(clean(data)));
    await saveFile("نسخة احتياطية - ملف المراجعة "+today()+".zip", await z.generateAsync({type:"uint8array"}));
  }catch(e){ toast("تعذر تجهيز النسخة الاحتياطية."); }
  btn.disabled = false; btn.textContent = "تحميل نسخة احتياطية كاملة";
}
async function backupImport(file){
  if (!S.db || !S.assets){ toast("الاستيراد يحتاج الحفظ يكون متاح."); return; }
  try{
    const z = await JSZip.loadAsync(await file.arrayBuffer()), d = JSON.parse(await z.file("data.json").async("string"));
    toast("جاري استيراد النسخة…");
    const moved = {};
    const moveFiles = async files => { const out = [];
      for (const f of (files||[])){
        if (moved[f.id]){ out.push(moved[f.id]); continue; }
        const zf = z.file("files/"+f.id); if (!zf) continue;
        const bytes = await zf.async("uint8array");
        const blob = f.wrapped && S.assets.raw ? (() => { const j = JSON.parse(new TextDecoder().decode(bytes)); const bin = atob(j.b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new File([u], f.name, {type:f.type||""}); })()
          : new File([bytes], f.wrapped ? f.id+".json" : f.name, {type: f.wrapped ? "text/plain" : (f.type||"")});
        const r = await S.assets.upload(blob, f.wrapped && !S.assets.raw ? {type:"text/plain"} : undefined);
        moved[f.id] = {...f, id:r.id, url:r.url, wrapped: f.wrapped && !S.assets.raw}; out.push(moved[f.id]);
      } return out; };
    const strip = ({id, ...b}) => b;
    await save("app/settings", d.settings); await save("app/notes", {map:d.notes||{}});
    for (const r of d.requests||[]) await save("requests/"+r.id, {...strip(r), files:await moveFiles(r.files)});
    for (const x of d.docs||[]) await save("docs/"+x.id, {...strip(x), files:await moveFiles(x.files)});
    for (const l of d.letters||[]) await save("letters/"+l.id, strip(l));
    for (const h of d.faDocs||[]) await save("fa/"+h.id.replace(/\//g,"~"), {files:await moveFiles(h.files), notes:h.notes||""});
    for (const a of d.adj||[]) await save("adj/"+a.id, strip(a));
    for (const p of d.policies||[]) await save("policies/"+p.id, strip(p));
    await save("app/fsmap", d.fsmap||{overrides:{}}); await save("app/fa", d.fa||{rates:{}});
    if (d.fsprior) await save("app/fsprior", d.fsprior);
    if (d.coa){ S.coa.rows = new Map(d.coa.rows.map(r => [String(r[0]), {code:String(r[0]), name:r[1], dr:r[2]||"", cr:r[3]||"", ok:!!r[4]}])); S.coa.meta = {...(S.coa.meta||{}), source:d.coa.source}; await saveCoa(true); }
    if (d.tb) await writeTB({...d.tb.meta, importedAt:new Date().toISOString()}, d.tb.rows.map(r => ({gl:r[0], sub:r[1], name:r[2], prior:r[3], current:r[4], mdr:r[5]||0, mcr:r[6]||0})));
    toast("تم استيراد النسخة الاحتياطية"); render();
  }catch(e){ toast("الملف ده مش نسخة احتياطية من البرنامج."); }
}

const NATIVE = /^(application\/pdf|image\/(png|jpeg|gif|webp))$/;
const OK_EXT = ["gif","png","jpg","jpeg","webp","txt","json","md","docx","pptx","csv","html","svg","pdf","xlsx","zip"];
function readB64(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]||""); fr.onerror = rej; fr.readAsDataURL(file); }); }
function findHolder(kind, id){
  if (kind==="fa") return S.fs.faDocs[id] || (S.fs.faDocs[id] = {id, files:[], notes:""});
  return kind==="req" ? S.requests.find(r=>r.id===id) : S.docs.find(d=>d.id===id);
}
function saveFa(h){ return save("fa/"+h.id.replace(/\//g,"~"), {files:h.files||[], notes:h.notes||"", updatedAt:new Date().toISOString()}); }
const saveHolder = (kind, h) => kind==="req" ? saveReq(h) : kind==="fa" ? saveFa(h) : saveDoc(h);
async function uploadTo(kind, id, files){
  const key = kind+":"+id; S.ui.uploading[key] = files.length; render();
  const added = [];
  for (const f of files){
    try{
      let r, wrapped = false;
      if (NATIVE.test(f.type) || S.assets.raw) r = await S.assets.upload(f);
      else {
        if (f.size > 15*1048576){ toast("الملف "+f.name+" أكبر من 15 ميجا."); continue; }
        const b64 = await readB64(f);
        r = await S.assets.upload(new Blob([JSON.stringify({v:1, name:f.name, type:f.type, b64})], {type:"text/plain"}), {type:"text/plain"});
        wrapped = true;
      }
      added.push({id:r.id, url:r.url, name:f.name, size:f.size, type:f.type||"", wrapped, at:new Date().toISOString()});
    }catch(e){
      const c = e && e.code;
      toast(c==="too_large" ? "الملف "+f.name+" أكبر من المسموح (20 ميجا)." : c==="quota_or_state" ? "مساحة المرفقات امتلأت." : "تعذر رفع "+f.name);
    }
  }
  delete S.ui.uploading[key];
  const h = findHolder(kind, id);
  if (h && added.length){ h.files = (h.files||[]).concat(added); await saveHolder(kind, h); toast("تم رفع "+added.length+" ملف"); }
  render();
}
async function downloadFile(meta){
  try{
    const res = await fetch(meta.url || ("/_blob/"+meta.id));
    let data;
    if (meta.wrapped){ const j = JSON.parse(await res.text()); const bin = atob(j.b64); data = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) data[i] = bin.charCodeAt(i); }
    else data = new Uint8Array(await res.arrayBuffer());
    const ext = (meta.name.split(".").pop()||"").toLowerCase();
    let name = meta.name;
    if (!OK_EXT.includes(ext)){
      if (!window.JSZip){ toast("صيغة الملف غير مدعومة للتحميل هنا."); return; }
      const z = new JSZip(); z.file(meta.name, data); data = await z.generateAsync({type:"uint8array"}); name = meta.name+".zip";
    }
    await S.downloads.save({filename:name, data});
  }catch(e){ if (!(e && e.code==="declined")) toast("تعذر تحميل الملف."); }
}
async function removeFile(kind, id, i){
  const h = findHolder(kind, id); if (!h) return;
  const f = h.files[i];
  try{ await S.assets.delete(f.id); }catch(e){}
  h.files = h.files.filter((_,j)=>j!==i); S.ui.confirm = null;
  await saveHolder(kind, h); render();
}

// ---------- docx ----------
function xmlEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function docxParas(text){
  return text.split("\n").map(line => {
    const runs = line.split(/(\*\*.+?\*\*)/).filter(Boolean).map(seg => {
      const b = /^\*\*.+\*\*$/.test(seg), t = b ? seg.slice(2,-2) : seg;
      return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${b?"<w:b/><w:bCs/>":""}<w:rtl/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
    }).join("");
    return `<w:p><w:pPr><w:bidi/><w:spacing w:after="80" w:line="320" w:lineRule="auto"/></w:pPr>${runs}</w:p>`;
  }).join("");
}
async function docxBuild(texts){
  const z = new JSZip();
  z.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  z.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  const pb = `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
  z.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${texts.map(docxParas).join(pb)}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1300" w:right="1200" w:bottom="1300" w:left="1200" w:header="708" w:footer="708" w:gutter="0"/><w:bidi/></w:sectPr></w:body></w:document>`);
  return z.generateAsync({type:"uint8array"});
}
async function saveFile(filename, data){
  try{ await S.downloads.save({filename, data}); toast("تم الحفظ"); }
  catch(e){ if (!(e && e.code==="declined")) toast("تعذر حفظ الملف في هذه الشاشة."); }
}

    const cur = S.fs.prior || DRAFT_PRIOR, v = {...cur.v}, id = t.dataset.prior, x = +t.value||0;
    v[id] = assetSec(lineOf(FS_SUB[id].line).sec) ? x : -x;
    const o = {label:cur.label||A().priorLabel, oci:cur.oci||0, source:(cur.source||"")+(/معدلة/.test(cur.source||"")?"":" (معدلة يدويًا)"), v};
    S.fs.prior = o; await save("app/fsprior", o); softRender(); return;
  }
  if (t.dataset.rate){ S.fs.rates[t.dataset.rate] = t.value; save("app/fa", {rates:S.fs.rates}); return; }
  if (t.dataset.fanote){ const h = findHolder("fa", t.dataset.fanote); h.notes = t.value; saveFa(h); return; }
  if (t.dataset.polt || t.dataset.polb){
    const pid = t.dataset.polt || t.dataset.polb, p = policyList().find(x => x.id===pid);
    const o = {t: t.dataset.polt ? (t.value||p.t) : p.t, body: t.dataset.polb ? t.value : p.body};
    S.fs.policies[pid] = {id:pid, ...o}; await save("policies/"+pid, o); render(); return;
  }
  if (t.id==="onlyFlag"){ S.ui.flagged = t.checked; render(); return; }
  if (t.id==="covPct"){ S.ui.cov = Math.min(100, Math.max(1, +t.value||70)); render(); return; }
  if (t.id==="lt-body"){ saveLetterBody(t.value); return; }
  if (t.id==="lt-title"){ const lid = S.ui.letter, L = letterList().find(l=>l.id===lid); const o = {title:t.value||L.title, group:L.group||"", body:L.body}; S.letters[lid] = {id:lid, ...o}; save("letters/"+lid, o); render(); return; }
  if (t.id && t.id.startsWith("lf-")){ S.ui.lf[t.id.slice(3)] = t.value; render(); return; }
  if (t.dataset.set){
    const [sec, k] = t.dataset.set.split(".");
    S.settings[sec][k] = t.type==="checkbox" ? t.checked : t.type==="number" ? (+t.value||0) : t.value;
    saveSettings(); softRender(); return;
  }
  if (t.dataset.r!=null){ S.settings.rules[+t.dataset.r][t.dataset.f] = t.value; saveSettings(); softRender(); return; }
  if (t.dataset.src){
    const f = t.files[0]; if (!f) return;
    try{ const wb = XLSX.read(await f.arrayBuffer(), {type:"array"}); const s = {fname:f.name, wb, sheet:wb.SheetNames[0]}; loadSheet(s); S.ui.imp.src[t.dataset.src] = s; render(); }
    catch(_){ toast("تعذرت قراءة الملف. تأكد إنه ملف إكسيل أو CSV."); }
    return;
  }
  if (t.dataset.k){
    const s = S.ui.imp.src[t.dataset.k], f = t.dataset.f;
    if (f==="sheet"){ s.sheet = t.value; loadSheet(s); }
    else if (f==="hdr"){ s.hdr = Math.max(0,(+t.value||1)-1); loadSheet(s, true); }
    else if (f==="pair"){ s.pair = t.checked; }
    else if (f.includes(".")){ const [p,k] = f.split("."); s.map[p][k] = k==="type" ? t.value : +t.value; }
    else s.map[f] = +t.value;
    render();
  }
});
app.addEventListener("input", e => {
  if (e.target.id==="mapQ"){ S.ui.mapQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#mapQ"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (e.target.id==="q"){ S.ui.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); }
});
// storage usage on settings view
const usageObs = new MutationObserver(async () => {
  const el = $("#usageTxt"); if (!el || !S.assets || el.dataset.done) return; el.dataset.done = "1";
  try{ const {usage} = await S.assets.list(); el.textContent = `${usage.files} ملف · ${fsize(usage.bytes)} مستخدمة` + (usage.maxBytes ? ` من ${fsize(usage.maxBytes)}` : ""); }catch(_){ el.textContent = "تعذر قراءة المساحة."; }
});
usageObs.observe(app, {childList:true});

document.documentElement.setAttribute("dir","rtl");
document.documentElement.setAttribute("lang","ar");
render();
initCaps();
</script>
